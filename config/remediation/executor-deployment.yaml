apiVersion: apps/v1
kind: Deployment
metadata:
  name: exitguard-executor
  namespace: exitguard-system
  labels:
    app.kubernetes.io/name: exitguard
    app.kubernetes.io/component: executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exitguard
      app.kubernetes.io/component: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exitguard
        app.kubernetes.io/component: executor
    spec:
      serviceAccountName: exitguard-executor
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: exitguard:latest
          imagePullPolicy: IfNotPresent
          args:
            - --component=executor
            - --leader-elect=true
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --health-probe-bind-address=:8081
          ports:
            - name: https-metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
