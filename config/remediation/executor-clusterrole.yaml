apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: exitguard-executor
rules:
  # Target access is intentionally dangerous and exists only in remediation profile.
  # Wildcard resources cover built-in workloads and CRDs while excluding the operator,
  # RBAC, admission, and API aggregation groups from target mutation authority.
  - apiGroups:
      - ""
      - apps
      - autoscaling
      - batch
      - networking.k8s.io
      - policy
      - scheduling.k8s.io
      - storage.k8s.io
      - apiextensions.k8s.io
    resources: ["*"]
    verbs: ["get", "patch"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
  # Policy and incident reads revalidate every approval immediately before mutation.
  - apiGroups: ["safety.exitguard.io"]
    resources: ["terminationpolicies", "deletionincidents"]
    verbs: ["get", "list", "watch"]
  # The executor owns approval metadata (owner reference) and status only.
  - apiGroups: ["safety.exitguard.io"]
    resources: ["remediationapprovals"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["safety.exitguard.io"]
    resources: ["remediationapprovals/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces/finalize"]
    verbs: ["update"]
  # Leader election still uses core/v1 events; remediation audit events use events.k8s.io/v1.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
