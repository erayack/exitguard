    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TerminationPolicy declares which deleting resources to diagnose
          and which actions may be approved.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TerminationPolicySpec selects targets and sets diagnosis
              and remediation limits.
            properties:
              diagnosis:
                default:
                  checkAPIServices: true
                  checkWebhooks: true
                  maxCRDInstances: 5000
                  maxNamespaceObjects: 5000
                description: Diagnosis configures bounded, read-only evidence collection.
                properties:
                  checkAPIServices:
                    default: true
                    description: CheckAPIServices enables aggregated API availability
                      diagnosis.
                    type: boolean
                  checkWebhooks:
                    default: true
                    description: CheckWebhooks enables fail-closed admission webhook
                      diagnosis.
                    type: boolean
                  maxCRDInstances:
                    default: 5000
                    description: MaxCRDInstances bounds custom-resource instances
                      enumerated for one terminating CRD.
                    format: int32
                    maximum: 100000
                    minimum: 1
                    type: integer
                  maxNamespaceObjects:
                    default: 5000
