                    - Low
                    - Medium
                    - High
                    - Critical
                    type: string
                required:
                - allowNamespaceForce
                - approvalTTL
                - maxRisk
                type: object
              retention:
                default:
                  resolvedIncidentTTL: 720h
                description: Retention controls cleanup of resolved incidents.
                properties:
                  resolvedIncidentTTL:
