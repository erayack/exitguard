                    format: int32
                    maximum: 100000
                    minimum: 1
                    type: integer
                required:
                - checkAPIServices
                - checkWebhooks
                - maxCRDInstances
                - maxNamespaceObjects
                type: object
              finalizerOwners:
                description: FinalizerOwners contains exact, deterministic finalizer
                  ownership mappings.
                items:
                  description: FinalizerOwner maps an exact finalizer to the workload
                    responsible for it.
                  properties:
                    controllerRef:
                      description: ControllerRef identifies the workload whose availability
                        should be checked.
                      properties:
                        apiVersion:
                          description: APIVersion must identify the apps API used
                            by the controller workload.
                          enum:
                          - apps/v1
                          type: string
                        kind:
                          description: Kind is a supported controller workload.
                          enum:
                          - Deployment
                          - StatefulSet
                          - DaemonSet
                          type: string
                        name:
                          description: Name is the controller workload name.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace contains the controller workload.
                          minLength: 1
                          type: string
