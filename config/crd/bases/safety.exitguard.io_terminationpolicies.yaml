                  allowNamespaceForce: false
                  approvalTTL: 1h
                  maxRisk: None
                description: Remediation limits action eligibility but never triggers
                  automatic mutation.
                properties:
                  allowNamespaceForce:
                    default: false
                    description: AllowNamespaceForce permits Critical namespace force-finalization
